name: Build and Release Ryvane

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build single portable Ryvane EXE
        run: npm run dist

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist -Filter 'Ryvane-Tweaks.exe' -File | Select-Object -First 1
          if (-not $exe) { throw 'Ryvane-Tweaks.exe was not produced.' }
          $hash = (Get-FileHash -Algorithm SHA256 $exe.FullName).Hash.ToLower()
          "$hash  $($exe.Name)" | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Upload portable EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ryvane-Tweaks
          path: |
            dist/Ryvane-Tweaks.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Ryvane-Tweaks.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
